repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: gitleaks staged secret scan
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: bandit
        name: bandit medium/high Python scan
        entry: bandit -q -ll
        language: system
        types: [python]
      - id: semgrep
        name: semgrep security audit
        entry: semgrep scan --error --config p/security-audit --metrics=off
        language: system
        types: [text]
