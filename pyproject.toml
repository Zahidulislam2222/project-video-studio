[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "TRY004"]

[tool.mypy]
files = ["config.py", "media_tools.py", "narration.py", "studio.py", "timeline.py", "motion_design.py", "sound_design.py", "asset_library.py", "export_checks.py", "motion_board.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
